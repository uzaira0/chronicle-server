pluginManagement {
    plugins {
        id 'org.jetbrains.kotlin.jvm' version '2.3.21'
        id 'org.jetbrains.kotlin.plugin.spring' version '2.3.21'
        id 'org.jetbrains.dokka' version '2.2.0'
        id 'com.github.spotbugs' version '6.5.5'
        id 'com.github.jk1.dependency-license-report' version '3.1.2'
    }
    repositories {
        maven {
            url = uri("https://maven.pkg.github.com/uzaira0/chronicle")
        }
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name='chronicle-server'

// Composite source checkouts default to the methodic monorepo siblings so the
// server always builds against the canonical checkouts. Each path can be
// overridden with -P<name>Dir=... or the matching environment variable.
def compositeDir = { String propName, String envName, String relativeDefault ->
    def requested = gradle.startParameter.projectProperties[propName] ?: System.getenv(envName)
    def dir = requested ? file(requested) : file(relativeDefault)
    if (!dir.exists()) {
        throw new GradleException("Composite checkout not found for ${propName}: ${dir}")
    }
    return dir
}

include ':rhizome'
project(':rhizome').projectDir = compositeDir('rhizomeDir', 'RHIZOME_DIR', '../rhizome')

include ':rhizome-client'
project(':rhizome-client').projectDir = compositeDir('rhizomeClientDir', 'RHIZOME_CLIENT_DIR', '../rhizome-client')

include ':chronicle-api'
project(':chronicle-api').projectDir = compositeDir('chronicleApiDir', 'CHRONICLE_API_DIR', '../chronicle-api')

include ':chronicle-models'
project(':chronicle-models').projectDir = compositeDir('chronicleModelsDir', 'CHRONICLE_MODELS_DIR', '../chronicle-models')
