# Rate Limiting Configuration

enabled: true

# Only unauthenticated work is limited (requests per minute). AUTH also bounds
# failed unauthenticated attempts per IP on every path.
auth-requests-per-minute: 10
# Enrollment preview
read-requests-per-minute: 100
# Enrollment and participant form code exchange
write-requests-per-minute: 60

# Burst capacity multiplier (allows temporary spikes)
burst-capacity-multiplier: 1.5

# Whitelisted IPs (bypass rate limiting)
whitelisted-ips:
  - "127.0.0.1"
  - "::1"

# Do not implicitly exempt RFC1918/private clients. Behind F5/Traefik, real
# clients can arrive via private proxy hops; use whitelisted-ips for explicit
# exceptions only.
whitelist-private-networks: false

# Exact whitelisted paths (bypass rate limiting)
whitelisted-paths:
  - "/healthcheck"
  - "/actuator/health"
  - "/actuator/prometheus"
  # These exact operational paths must remain independent of the
  # Hazelcast-backed limiter. Similar-looking sibling paths are not exempt.
  - "/chronicle/internal/health/live"
  - "/chronicle/internal/health/ready"
  - "/prometheus"
  - "/prometheus/"

# Client IP extraction
client-ip-header: "X-Forwarded-For"
client-ip-header-fallback: "X-Real-IP"
trust-proxy-headers: true
# Trust only a reverse proxy on this host by default; this matches the server-wide
# default in ClientIpResolver. A deployment names its own proxy subnet in
# CHRONICLE_TRUSTED_PROXY_CIDRS (selfhost sets it to web's core address, CHRONICLE_CORE_PREFIX.2/32), which
# replaces this list. Never use a broad private range such as 10.0.0.0/8 or 172.16.0.0/12.
trusted-proxy-cidrs:
  - "127.0.0.0/8"
  - "::1/128"

# Hazelcast configuration
hazelcast-map-name: "RATE_LIMIT_BUCKETS"
entry-ttl-seconds: 120
