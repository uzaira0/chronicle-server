error.request.missingHeader.detail={0}: Required header is missing
error.request.invalidParameterType=Invalid parameter type
error.request.invalidParameterType.detail={0}: Expected {1} value
error.request.invalidArgument=Invalid argument
error.state.invalid=Invalid state
error.generic=An error occurred
error.unexpected=An unexpected error occurred

