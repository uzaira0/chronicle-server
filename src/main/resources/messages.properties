# Chronicle server — English message table (the base bundle).
#
# This file is the ONLY table maintained in this repository. Translators copy it to
# messages_<lang>.properties (e.g. messages_es.properties) and translate the values; keys, {0}
# placeholders and their order must be preserved. Accept-Language on the request selects the
# table; anything a translation omits falls back to the English value here. See docs/I18N.md.
#
# On a line that contains a {0} placeholder, a literal apostrophe must be doubled ('') because
# java.text.MessageFormat treats a single quote as quoting. Lines with no placeholder are raw.
#
# Only text a participant or researcher reads is listed here. Field names, enum values,
# identifiers, audit descriptions and log lines are intentionally not translatable.

# --- Generic API error bodies (ApiError) ---
error.internal=An unexpected error occurred. Please contact support with error ID: {0}
error.internal.unknownId=unknown
error.unauthorized=Authentication required
error.forbidden=Access denied
error.notFound=The requested resource was not found
error.rateLimited.retryAfter=Rate limit exceeded. Please retry after {0} seconds.
error.rateLimited=Rate limit exceeded. Please try again later.

