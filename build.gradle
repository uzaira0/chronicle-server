    from('../selfhost') {
        include 'restore-continuity-digest.sql', 'restore-continuity.version',
                'restore-restrictions-schema.sql', 'restore-restrictions-containment.sql', 'restore-restrictions-verify.sql',
                'restore-authorities-schema.sql', 'restore-token-key-continuity.sql',
                'restore-withdrawal-containment.sql'
    }
}

sourceSets.jmh.resources.srcDir("src/test/resources")
